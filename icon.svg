<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#e6a050"/>
      <stop offset="0.55" stop-color="#b1552c"/>
      <stop offset="1" stop-color="#6b2720"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f3e7d2"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#3a120c" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- back card -->
  <g transform="rotate(-9 512 520)" filter="url(#sh)">
    <rect x="232" y="268" width="560" height="430" rx="64" fill="#f1dcbc" opacity="0.92"/>
  </g>
  <!-- front card -->
  <g transform="rotate(4 512 540)" filter="url(#sh)">
    <rect x="222" y="318" width="580" height="440" rx="64" fill="url(#card)"/>
    <!-- play -->
    <path d="M372 438 L372 638 L532 538 Z" fill="#7d2e24" stroke="#7d2e24" stroke-width="22" stroke-linejoin="round"/>
    <!-- sound waves -->
    <path d="M590 470 Q640 538 590 606" fill="none" stroke="#c8792b" stroke-width="30" stroke-linecap="round"/>
    <path d="M652 420 Q735 538 652 656" fill="none" stroke="#c8792b" stroke-width="30" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
